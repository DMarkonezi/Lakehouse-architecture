# Iceberg SQL ekstenzije (MERGE INTO, CALL procedure, grane/tagovi, ALTER ... PARTITION FIELD)
spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Katalog "lake" -> Iceberg REST katalog, podaci na MinIO (S3 API).
# Prelazak na Amazon S3: ukloniti s3.endpoint i s3.path-style-access, a akreditive dati preko IAM uloge.
spark.sql.catalog.lake                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                  rest
spark.sql.catalog.lake.uri                   http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse             s3://warehouse/
spark.sql.catalog.lake.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint           http://minio:9000
spark.sql.catalog.lake.s3.path-style-access  true
spark.sql.defaultCatalog                     lake

# JDBC drajver za citanje iz PostgreSQL-a
spark.jars.packages                          org.postgresql:postgresql:42.7.4

# Ogranicenje memorije (ceo stek mora da stane u ~8 GB koliko ima Docker)
spark.driver.memory                          3g
spark.sql.shuffle.partitions                 8
spark.sql.adaptive.enabled                   true

spark.sql.session.timeZone                   UTC
spark.ui.showConsoleProgress                 false
spark.eventLog.enabled                       false
